<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Whirl – Randolf's Assistant</title>
<style>
:root {
  --bg: #121214;
  --surface: #1a1a1e;
  --card: #222228;
  --border: #32323a;
  --text-main: #ffffff;
  --text-muted: #9e9ea7;
  --white-glow: rgba(255, 255, 255, 0.85);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  background: var(--surface);
}

.brand-title {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-main);
}

.brand-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.badge {
  font-size: 0.8rem;
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

/* EN / ET language switch */
.lang-switch {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow: hidden;
}

.lang-switch button {
  padding: 4px 12px;
  border: none;
  border-radius: 0;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.8rem;
  font-weight: 600;
}

.lang-switch button:hover {
  background: var(--card);
}

.lang-switch button.active {
  background: #ffffff;
  color: #121214;
}

#main-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem;
  overflow-y: auto;
}

/* Hero section with Headline and ORB */
#hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-top: 1rem;
  max-width: 680px;
}

.hero-text {
  font-size: 1.6rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-main);
  margin-bottom: 2rem;
  letter-spacing: -0.02em;
}

/* Animated ORB */
.orb-wrapper {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 2rem;
  cursor: pointer;
}

.orb {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d4d4d8 25%, #71717a 55%, #27272a 80%, #09090b 100%);
  box-shadow: 0 0 35px rgba(255, 255, 255, 0.25), inset 0 0 25px rgba(255, 255, 255, 0.4);
  animation: orb-idle 4s ease-in-out infinite alternate;
  transition: all 0.3s ease;
}

/* Idle animation */
@keyframes orb-idle {
  0% {
    transform: scale(1) translateY(0);
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.3);
  }
  100% {
    transform: scale(1.05) translateY(-6px);
    box-shadow: 0 0 45px rgba(255, 255, 255, 0.35), inset 0 0 30px rgba(255, 255, 255, 0.5);
  }
}

/* Speaking active animation (bright ripple & pulsing) */
.orb.speaking {
  animation: orb-speak 1s infinite ease-in-out alternate;
}

@keyframes orb-speak {
  0% {
    transform: scale(1.08);
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.7), 0 0 90px rgba(255, 255, 255, 0.3), inset 0 0 35px #ffffff;
  }
  100% {
    transform: scale(1.22);
    box-shadow: 0 0 80px rgba(255, 255, 255, 0.95), 0 0 130px rgba(255, 255, 255, 0.5), inset 0 0 45px #ffffff;
  }
}

/* Recording / Listening State */
.orb.recording {
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, #fca5a5 25%, #ef4444 60%, #991b1b 100%);
  animation: orb-record 0.8s infinite alternate;
  box-shadow: 0 0 50px rgba(239, 68, 68, 0.8);
}

@keyframes orb-record {
  from { transform: scale(1.02); }
  to { transform: scale(1.15); }
}

/* Chat log */
#chat-box {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  margin-bottom: 1rem;
}

.bubble {
  max-width: 85%;
  padding: 12px 18px;
  border-radius: 16px;
  line-height: 1.5;
  font-size: 0.95rem;
}

.agent {
  align-self: flex-start;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-main);
}

.user {
  align-self: flex-end;
  background: #ffffff;
  color: #121214;
  font-weight: 500;
}

/* Controls bar */
#controls {
  padding: 1rem 1.5rem;
  display: flex;
  gap: 0.6rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  justify-content: center;
  align-items: center;
}

.controls-inner {
  width: 100%;
  max-width: 680px;
  display: flex;
  gap: 0.6rem;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px 18px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-main);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}

input:focus {
  border-color: #71717a;
}

button {
  padding: 14px 22px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: #ffffff;
  color: #121214;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

button:hover {
  background: #e4e4e7;
}

#mic-btn.recording {
  background: #ef4444;
  border-color: #ef4444;
  color: #ffffff;
}

#interrupt-btn {
  background: #27272a;
  color: #ffffff;
  border-color: #3f3f46;
  display: none;
}

#interrupt-btn:hover {
  background: #3f3f46;
}

@media (max-width: 520px) {
  header { padding: 0.8rem 1rem; }
  .badge { display: none; }
  .hero-text { font-size: 1.3rem; }
  #controls { padding: 0.8rem 1rem; }
  button { padding: 12px 14px; }
}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand-title">WHIRL</div>
    <div class="brand-subtitle" data-i18n="subtitle">Personal Voice Agent of Randolf Alt</div>
  </div>
  <div class="header-right">
    <div class="badge" data-i18n="badge">EBS Finance &amp; Accounting</div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" id="lang-en" onclick="setLang('en')">EN</button>
      <button type="button" id="lang-et" onclick="setLang('et')">ET</button>
    </div>
  </div>
</header>

<div id="main-container">
  <div id="hero">
    <div class="hero-text" data-i18n="hero">
      Hi, I am Whirl. Personal assistant of Randolf, what would you like to know about him?
    </div>

    <div class="orb-wrapper" onclick="handleOrbClick()" id="orb-wrapper">
      <div id="whirl-orb" class="orb"></div>
    </div>
  </div>

  <div id="chat-box"></div>
</div>

<div id="controls">
  <div class="controls-inner">
    <button id="interrupt-btn" type="button" onclick="stopWhirl()"></button>
    <button id="mic-btn" type="button" onclick="toggleVoice()"></button>
    <input type="text" id="user-input"/>
    <button id="send-btn" onclick="sendMessage()"></button>
  </div>
</div>

<script>
const chatBox = document.getElementById("chat-box");
const input = document.getElementById("user-input");
const micBtn = document.getElementById("mic-btn");
const sendBtn = document.getElementById("send-btn");
const interruptBtn = document.getElementById("interrupt-btn");
const orb = document.getElementById("whirl-orb");
const orbWrapper = document.getElementById("orb-wrapper");

// ---------- Interface texts in English and Estonian ----------
const TEXTS = {
  en: {
    subtitle: "Personal Voice Agent of Randolf Alt",
    badge: "EBS Finance & Accounting",
    hero: "Hi, I am Whirl. Personal assistant of Randolf, what would you like to know about him?",
    placeholder: "Type or click Speak...",
    speak: "🎙️ Speak",
    done: "⏹️ Done",
    processing: "⏳ Processing...",
    interrupt: "⏹️ Interrupt",
    send: "Send",
    thinking: "Whirl is thinking...",
    error: "Error answering. Please try again.",
    mic: "Microphone permission needed.",
    orbTitle: "Click Orb to speak or interrupt"
  },
  et: {
    subtitle: "Randolf Alti isiklik hääleassistent",
    badge: "EBS rahandus ja arvestus",
    hero: "Tere, mina olen Whirl, Randolfi isiklik assistent. Mida soovite tema kohta teada?",
    placeholder: "Kirjutage või vajutage Räägi...",
    speak: "🎙️ Räägi",
    done: "⏹️ Valmis",
    processing: "⏳ Töötlen...",
    interrupt: "⏹️ Katkesta",
    send: "Saada",
    thinking: "Whirl mõtleb...",
    error: "Vastamisel tekkis viga. Palun proovige uuesti.",
    mic: "Vajalik on mikrofoni luba.",
    orbTitle: "Vajutage kerale, et rääkida või katkestada"
  }
};

function loadSavedLang() {
  try {
    const saved = localStorage.getItem("whirl-lang");
    if (saved === "en" || saved === "et") return saved;
  } catch (e) {}
  // First visit: Estonian browsers start in Estonian, everyone else in English
  return (navigator.language || "").toLowerCase().startsWith("et") ? "et" : "en";
}

let uiLang = loadSavedLang();

function t(key) {
  return TEXTS[uiLang][key];
}

function setLang(lang) {
  if (lang !== "en" && lang !== "et") return;
  uiLang = lang;
  try { localStorage.setItem("whirl-lang", lang); } catch (e) {}
  applyTexts();
}

function applyTexts() {
  document.documentElement.lang = uiLang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  input.placeholder = t("placeholder");
  sendBtn.innerText = t("send");
  interruptBtn.innerText = t("interrupt");
  orbWrapper.title = t("orbTitle");
  if (!micBtn.disabled) {
    micBtn.innerText = isRecording ? t("done") : t("speak");
  }
  document.getElementById("lang-en").classList.toggle("active", uiLang === "en");
  document.getElementById("lang-et").classList.toggle("active", uiLang === "et");
}

// ---------- Conversation ----------
let conversationHistory = [];
let currentAudio = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

function stopWhirl() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  orb.classList.remove("speaking");
  interruptBtn.style.display = "none";
}

function handleOrbClick() {
  if (currentAudio && !currentAudio.paused) {
    stopWhirl();
  } else {
    toggleVoice();
  }
}

async function toggleVoice() {
  stopWhirl();

  if (isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    orb.classList.remove("recording");
    micBtn.classList.remove("recording");
    micBtn.innerText = t("processing");
    micBtn.disabled = true;
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(track => track.stop());
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = async () => {
          const base64Audio = reader.result.split(",")[1];
          try {
            const res = await fetch("/transcribe", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ audio_base64: base64Audio, ui_lang: uiLang })
            });
            const data = await res.json();
            if (data.text && data.text.trim()) {
              sendMessage(data.text.trim(), data.lang);
            }
          } catch (e) {
            console.error("Transcription error:", e);
          } finally {
            micBtn.disabled = false;
            micBtn.innerText = t("speak");
          }
        };
      };
      mediaRecorder.start();
      isRecording = true;
      orb.classList.add("recording");
      micBtn.classList.add("recording");
      micBtn.innerText = t("done");
    } catch (err) {
      alert(t("mic"));
    }
  }
}

// spokenLang is set when the question came from the microphone (Whisper's detected language)
async function sendMessage(text, spokenLang) {
  stopWhirl();
  const msg = text || input.value.trim();
  if (!msg) return;

  appendBubble(msg, "user");
  input.value = "";
  const typing = appendBubble(t("thinking"), "agent");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: msg,
        history: conversationHistory,
        ui_lang: uiLang,
        input_lang: spokenLang || null
      })
    });
    const data = await res.json();
    typing.remove();
    appendBubble(data.reply, "agent");

    // If the recruiter switched language, follow them with the interface too
    if (data.lang && data.lang !== uiLang) setLang(data.lang);

    // Play audio & animate glowing Orb
    currentAudio = new Audio(data.audio);
    orb.classList.add("speaking");
    interruptBtn.style.display = "block";

    currentAudio.onended = () => {
      orb.classList.remove("speaking");
      interruptBtn.style.display = "none";
    };

    currentAudio.play();

    conversationHistory.push({ role: "user", content: msg });
    conversationHistory.push({ role: "assistant", content: data.reply });
  } catch (e) {
    typing.innerText = t("error");
    orb.classList.remove("speaking");
  }
}

function appendBubble(text, sender) {
  const b = document.createElement("div");
  b.className = `bubble ${sender}`;
  b.innerText = text;
  chatBox.appendChild(b);
  chatBox.scrollTop = chatBox.scrollHeight;
  return b;
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

applyTexts();
</script>
</body>
</html>
